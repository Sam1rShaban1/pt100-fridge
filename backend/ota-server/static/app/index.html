<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veze Sharri - Cold Chain</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">VS</span>
      <div class="brand-text">
        <h1>Veze Sharri</h1>
        <p>Cold chain monitoring</p>
      </div>
    </div>
    <div class="conn" id="conn">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">Connecting</span>
    </div>
  </header>

  <div class="layout">
    <main id="view" aria-live="polite"></main>
    <aside class="sidebar" aria-label="Rooms">
      <h3>Cold rooms</h3>
      <nav id="room-list"></nav>
    </aside>
  </div>

  <section class="fleet" id="fleet" aria-label="Fleet status"></section>

  <section class="history" id="history">
    <div class="history-head">
      <h3>Temperature history</h3>
      <div class="seg" id="range-seg" role="tablist" aria-label="Time range">
        <button class="seg-btn" data-min="30" role="tab">30m</button>
        <button class="seg-btn active" data-min="60" role="tab">1h</button>
        <button class="seg-btn" data-min="360" role="tab">6h</button>
        <button class="seg-btn" data-min="1440" role="tab">24h</button>
      </div>
    </div>
    <p class="history-hint">Drag across a chart to zoom the time axis. Double-click to reset.</p>
    <div class="history-grid" id="hist-grid"></div>
  </section>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
