per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd

# Internal listener (docker network only): plain TCP for Telegraf + OTA server
listener 1883
bind 0.0.0.0

# Internet listener (TLS) for ESP32 devices. Certificate signed by the
# project CA in ./certs (ca.crt is embedded in the firmware as MQTT_ROOT_CA).
listener 8883
bind 0.0.0.0
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
