# Local testing override (no domain / no public TLS) — tuned for ARM64 (Raspberry Pi).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Then reach:
#   Grafana    http://<pi-ip>:3000
#   OTA server http://<pi-ip>:8010
# Caddy (public TLS / Let's Encrypt) is disabled here because it needs a
# public domain + ports 80/443.
# platform: linux/arm64 is pinned because Docker's default "arm/v8" guess
# fails to resolve some multi-arch manifests (e.g. influxdb:3-core) on the Pi.
services:
  caddy:
    profiles: ["disabled"]

  influxdb3:
    platform: linux/arm64

  mosquitto:
    platform: linux/arm64

  telegraf:
    platform: linux/arm64

  grafana:
    ports:
      - "3000:3000"
    platform: linux/arm64

  ota-server:
    # NOTE: do NOT pin platform here. A platform pin on a BUILD service makes
    # BuildKit run `RUN pip install` in a mode that fails on the Pi (exit 159).
    # ota-server builds natively on arm64 without it.
    ports:
      - "8010:8000"
