; PT100 cold-chain sensor firmware — Raspberry Pi Pico W (RP2040).
;
; Build:   pio run -e pico-w
; Flash:   pio run -e pico-w -t upload     (first flash must be over USB)
; OTA:     pio run -e pico-w -t build      -> .pio/build/pico-w/firmware.bin
;          upload that .bin in the dashboard with hardware target "pico-w".
;
; Use the Pico W board definition so the RP2040 core receives the correct
; wireless-board and USB power configuration.
;
; Flash layout (2 MB):
;   boot2 + OTA bootloader + app   ~1.02 MB
;   LittleFS (OTA staging)          1 MB
;   EEPROM (boot counter)           4 KB
; OTA stages the image in LittleFS, so the filesystem must be at least as
; large as the firmware binary. If the sketch ever outgrows ~1 MB, build for a
; board with more flash and change board_upload.maximum_size accordingly.

[env:pico-w]
platform = raspberrypi
board = rpipicow
framework = arduino
board_build.filesystem_size = 1m
upload_protocol = picotool
monitor_speed = 115200

build_flags =
    -Wall

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
