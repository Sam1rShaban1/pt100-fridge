[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    -D ARDUINO_ARCH_ESP32
